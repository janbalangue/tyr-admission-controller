name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    name: Node ${{ matrix.node }} · lint/test/build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Offline guard: vendored tarballs match the lockfile.
      - name: Verify vendored artifacts
        run: npm run verify:vendor

      # Online guard: those tarballs are the artifacts npm actually published,
      # so a local pre-release build cannot ship under a released version.
      - name: Verify vendored artifact provenance
        run: npm run verify:vendor-provenance

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The self-serve evaluation must keep working from a clean checkout:
      # interactive traffic fully protected, provider never over capacity.
      - name: Evaluation (mock provider)
        run: node eval/run.mjs --quick --assert

      - name: Pack (dry-run)
        shell: bash
        run: |
          set -euo pipefail
          rm -f *.tgz
          npm pack

      - name: Verify tarball contains dist + types
        shell: bash
        run: |
          set -euo pipefail

          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TGZ="${NAME}-${VERSION}.tgz"

          echo "Tarball: $TGZ"
          test -f "$TGZ" || { echo "Tarball not found: $TGZ"; ls -la; exit 1; }

          tar -tf "$TGZ" > contents.txt

          echo "Tarball contents:"
          cat contents.txt

          grep -Fxq 'package/dist/index.d.ts' contents.txt || { echo "Missing package/dist/index.d.ts"; exit 1; }
          grep -Fxq 'package/dist/index.js' contents.txt || { echo "Missing package/dist/index.js"; exit 1; }

  # Builds the image for both platforms on every run, so a Dockerfile that does
  # not build fails before a release. Only a version tag logs in and pushes.
  image:
    name: Container image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is named after the repository, so it follows the repository's
      # owner. Only the exact version is tagged: there is no mutable `latest`.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Tyr Admission Controller

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  release:
    name: Create GitHub Release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract changelog section for tag
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES_FILE="release-notes.md"

          # Extract the section between "## [VERSION]" and the next "## [" heading,
          # or the "---" separator line, whichever comes first.
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^---[ \t]*$/ { exit }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [ -s "$NOTES_FILE" ]; then
            echo "Extracted changelog section for $VERSION"
            echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changelog section found for $VERSION; falling back to auto-generated notes"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.changelog.outputs.has_notes == 'true' && steps.changelog.outputs.notes_file || null }}
          generate_release_notes: ${{ steps.changelog.outputs.has_notes != 'true' }}
